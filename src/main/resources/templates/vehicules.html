<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Véhicules - AutoLoc</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside th:replace="~{fragments :: sidebar('vehicules')}"></aside>

<main class="contenu">
    <h1>Véhicules</h1>
    <p class="sous-titre">Gérez votre flotte</p>

    <div class="alerte succes" th:if="${succes}" th:text="${succes}"></div>
    <div class="alerte erreur" th:if="${erreur}" th:text="${erreur}"></div>

    <section class="panneau">
        <h2>Ajouter un véhicule</h2>
        <form method="post" th:action="@{/vehicules}" class="formulaire">
            <label>Immatriculation
                <input type="text" name="immatriculation" placeholder="AB-123-CD" required>
            </label>
            <label>Marque et modèle
                <input type="text" name="marque" placeholder="Toyota Corolla" required>
            </label>
            <label>Prix par jour
                <input type="number" name="prixParJour" min="1" step="any" placeholder="80" required>
            </label>
            <button type="submit" class="bouton">Ajouter</button>
        </form>
    </section>

    <section class="panneau">
        <h2>Flotte (<span th:text="${#lists.size(vehicules)}">0</span>)</h2>
        <div class="tableau-conteneur">
            <table class="tableau">
                <thead>
                <tr>
                    <th>Immatriculation</th>
                    <th>Véhicule</th>
                    <th>Prix / jour</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vehicules}">
                    <td th:text="${v.immatriculation}">AB-123-CD</td>
                    <td th:text="${v.marque}">Toyota</td>
                    <td th:text="${v.prixParJour}">80</td>
                    <td>
                        <span class="badge vert" th:if="${v.disponible}">Disponible</span>
                        <span class="badge orange" th:unless="${v.disponible}">Loué</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
