<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Location de véhicules</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside th:replace="~{fragments :: sidebar('accueil')}"></aside>

<main class="contenu">
    <h1>Tableau de bord</h1>
    <p class="sous-titre">Vue d'ensemble de votre activité</p>

    <section class="cartes">
        <div class="carte">
            <span class="carte-label">Véhicules</span>
            <span class="carte-valeur" th:text="${nbVehicules}">0</span>
        </div>
        <div class="carte vert">
            <span class="carte-label">Disponibles</span>
            <span class="carte-valeur" th:text="${nbDisponibles}">0</span>
        </div>
        <div class="carte orange">
            <span class="carte-label">Locations en cours</span>
            <span class="carte-valeur" th:text="${nbEnCours}">0</span>
        </div>
    </section>
</main>
</body>
</html>
